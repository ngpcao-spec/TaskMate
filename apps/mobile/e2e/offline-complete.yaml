appId: app.taskmate.family
---
# Critère §8 (v4) : cocher hors ligne puis revenir en ligne ne produit qu'un passage en « Chờ duyệt » — AUCUN point.
- launchApp
- setAirplaneMode: enabled
- tapOn:
    id: "Làm bài tập Toán"
    index: 0
- assertVisible: "Đang offline — thay đổi sẽ được đồng bộ khi có mạng"
- assertVisible: "Chờ duyệt"
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible: "Đang offline — thay đổi sẽ được đồng bộ khi có mạng"
    timeout: 20000
- assertVisible: "Chờ duyệt"
- tapOn: "Thêm"
- tapOn: "Điểm thưởng"
- assertVisible: "+10 điểm chờ duyệt"
