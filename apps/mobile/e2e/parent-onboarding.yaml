appId: app.taskmate.family
---
- clearState
- launchApp
- tapOn: "Bắt đầu"
- tapOn: "Tôi là phụ huynh"
- tapOn:
    id: "Email"
- inputText: "parent@taskmate.test"
- tapOn: "Gửi mã"
- tapOn:
    id: "Mã xác nhận"
- inputText: ${OTP}
- tapOn: "Xác nhận"
- tapOn:
    id: "Tên gia đình"
- inputText: "Gia đình Nguyễn"
- tapOn:
    id: "Tên của bạn"
- inputText: "Ba"
- tapOn: "Tiếp tục"
- tapOn:
    id: "Tên của con"
- inputText: "Minh"
- tapOn:
    id: "Ngày sinh (YYYY-MM-DD)"
- inputText: "2009-03-01"
- tapOn: "Thêm con"
- assertVisible: "Mã mời"
- tapOn: "Hoàn tất"
- assertVisible: "Chào Minh!"
