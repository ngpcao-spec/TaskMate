name: Deploy Edge Functions
# Méthode de REPLI : en temps normal, l'intégration GitHub de Supabase (« Deploy to production ») déploie les Edge Functions
# déclarées dans supabase/config.toml à chaque fusion sur main. Ce workflow ne se lance qu'à la main (Actions → Deploy Edge Functions → Run workflow).
# Prérequis : secret GitHub SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens), voir HUMAN_TODO.md.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: olftkozksanvnzlsvwrp # identifiant public du projet (pas un secret)
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with: { version: 2.119.0 }
      - name: Jeton présent ?
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Secret SUPABASE_ACCESS_TOKEN absent (GitHub → Settings → Secrets and variables → Actions)"; exit 1; }
      - run: supabase functions deploy --project-ref "$PROJECT_REF"
